image: docker:latest

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CI_REGISTRY_IMAGE: registry.gitlab.com/${CI_PROJECT_PATH}
  K8S_NAMESPACE: interview-demo

services:
  - docker:dind

stages:
  - validate
  - build
  - package
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/bin/
    - apps/frontend/node_modules/
    - ~/.cache/go-build/
    - ~/.bun/install/cache/

before_script:
  - apk add --no-cache go
  - curl -fsSL https://bun.sh/install | bash
  - export BUN_INSTALL="$HOME/.bun"
  - export PATH="$BUN_INSTALL/bin:$PATH"
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ── Validate ──────────────────────────────────────────────

lint-backend:
  stage: validate
  script:
    - cd backend && go vet ./...
  only:
    - main
    - merge_requests

test-backend:
  stage: validate
  script:
    - cd backend && go test -count=1 ./internal/...
  only:
    - main
    - merge_requests

lint-frontend:
  stage: validate
  script:
    - cd apps/frontend && bun install && bun run lint
  only:
    - main
    - merge_requests

# ── Build ─────────────────────────────────────────────────

build-backend:
  stage: build
  script:
    - cd backend && go build -o bin/server ./cmd/server/
  artifacts:
    paths:
      - backend/bin/server
    expire_in: 1 hour
  only:
    - main

build-frontend:
  stage: build
  script:
    - cd apps/frontend && bun install && bun run build
  artifacts:
    paths:
      - apps/frontend/dist
    expire_in: 1 hour
  only:
    - main

build-interview-docs:
  stage: build
  script:
    - cd apps/interview-docs && bun install && bun run build
  artifacts:
    paths:
      - apps/interview-docs/dist
    expire_in: 1 hour
  only:
    - main

# ── Package ───────────────────────────────────────────────

docker-backend:
  stage: package
  needs:
    - build-backend
    - build-frontend
  script:
    - docker build --target backend -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main

docker-frontend:
  stage: package
  needs:
    - build-backend
    - build-frontend
  script:
    - docker build --target frontend -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main

docker-interview-docs:
  stage: package
  needs:
    - build-interview-docs
  script:
    - docker build --target interview-docs -t $CI_REGISTRY_IMAGE/interview-docs:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/interview-docs:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/interview-docs:latest
    - docker push $CI_REGISTRY_IMAGE/interview-docs:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/interview-docs:latest
  only:
    - main

# ── Deploy ────────────────────────────────────────────────

deploy-k8s:
  stage: deploy
  needs:
    - docker-backend
    - docker-frontend
    - docker-interview-docs
  image: alpine/helm:3.17.0
  script:
    - helm upgrade --install interview-demo ./helm
        --namespace $K8S_NAMESPACE
        --create-namespace
        --set backend.image.repository=$CI_REGISTRY_IMAGE/backend
        --set backend.image.tag=$CI_COMMIT_SHORT_SHA
        --set frontend.image.repository=$CI_REGISTRY_IMAGE/frontend
        --set frontend.image.tag=$CI_COMMIT_SHORT_SHA
        --set interviewDocs.image.repository=$CI_REGISTRY_IMAGE/interview-docs
        --set interviewDocs.image.tag=$CI_COMMIT_SHORT_SHA
        --wait --timeout 120s
  only:
    - main
  environment:
    name: production
    url: https://interview-demo.example.com

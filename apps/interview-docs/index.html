<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3eaf7c" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <!-- DNS & connection hints -->
    <link rel="dns-prefetch" href="//github.com">
    <link rel="preconnect" href="//github.com">

    <!-- Speculation Rules: instant prerender for doc navigation -->
    <script type="speculationrules">
      {
        "prerender": [{
          "where": { "href_matches": "/*" },
          "eagerness": "moderate"
        }]
      }
    </script>

    <title>前端知识体系</title>
    <style>
      #global-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e2e3;
        border-top-color: #3eaf7c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .dark .spinner {
        border-color: #333355;
        border-top-color: #4ec9b0;
      }
      .loading-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.9rem;
        color: #888;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (() => {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="global-loading">
        <div class="spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

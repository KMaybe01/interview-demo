basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  demo.CompleteUploadRequest:
    properties:
      uploadId:
        type: string
    required:
    - uploadId
    type: object
  demo.InitUploadRequest:
    properties:
      chunkSize:
        type: integer
      fileHash:
        type: string
      fileSize:
        type: integer
      filename:
        type: string
      totalChunks:
        type: integer
    required:
    - chunkSize
    - fileSize
    - filename
    - totalChunks
    type: object
  demo.PageReport:
    properties:
      cls:
        type: number
      inp:
        type: number
      lcp:
        type: number
      pageName:
        type: string
      path:
        type: string
      referrer:
        type: string
      renderDuration:
        type: number
    type: object
  demo.PageSummary:
    properties:
      avgCLS:
        type: number
      avgINP:
        type: number
      avgLCP:
        type: number
      avgRenderMs:
        type: number
      lastVisit:
        type: integer
      latestCLS:
        type: number
      latestINP:
        type: number
      latestLCP:
        type: number
      maxRenderMs:
        type: number
      minRenderMs:
        type: number
      pageName:
        type: string
      path:
        type: string
      visits:
        type: integer
    type: object
  demo.ValidationRequest:
    properties:
      data:
        additionalProperties: true
        type: object
      schema:
        additionalProperties: true
        type: object
    type: object
  demo.VitalsReport:
    properties:
      cls:
        type: number
      fcp:
        type: number
      inp:
        type: number
      lcp:
        type: number
      metric:
        type: string
      rating:
        type: string
      ttfb:
        type: number
      url:
        type: string
      value:
        type: number
      version:
        type: string
    type: object
  demo.VitalsSummary:
    properties:
      avg:
        type: number
      count:
        type: integer
      max:
        type: number
      metric:
        type: string
      min:
        type: number
      rating:
        type: string
      value:
        type: number
    type: object
  demo.checkBody:
    properties:
      nodes:
        items:
          $ref: '#/definitions/demo.checkNodeBody'
        type: array
      roleCode:
        type: integer
    required:
    - nodes
    - roleCode
    type: object
  demo.checkNodeBody:
    properties:
      key:
        type: string
      requiredPerms:
        items:
          type: integer
        type: array
    type: object
  model.Message:
    properties:
      content:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      role:
        type: string
      timestamp:
        type: string
    required:
    - content
    - role
    type: object
  payment.CheckRequest:
    properties:
      amount:
        type: integer
      ip:
        type: string
      orderNo:
        type: string
      sign:
        type: string
    type: object
  payment.DemoRequest:
    properties:
      maxRetries:
        type: integer
    type: object
  payment.Request:
    properties:
      amount:
        type: integer
      channel:
        type: string
      idempotencyKey:
        type: string
      orderNo:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: dev@example.com
    name: Developer
  description: AI Agent Demo — Go + Gin 后端，提供 13 个技术演示场景的 API 支持
  title: Interview Demo API
  version: "1.0"
paths:
  /agents:
    get:
      description: 返回所有已创建的智能体列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出智能体
      tags:
      - 智能体
    post:
      consumes:
      - application/json
      description: 创建指定类型的 AI 智能体（ReAct/Function/Multi/RAG）
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
            type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 创建智能体
      tags:
      - 智能体
  /agents/{id}:
    delete:
      description: 删除指定的智能体
      parameters:
      - description: 智能体 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 删除智能体
      tags:
      - 智能体
  /agents/{id}/execute:
    post:
      consumes:
      - application/json
      description: 执行指定智能体，返回推理过程和最终响应
      parameters:
      - description: 智能体 ID
        in: path
        name: id
        required: true
        type: string
      - description: 执行请求
        in: body
        name: body
        required: true
        schema:
          properties:
            input:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 执行智能体
      tags:
      - 智能体
  /alerts:
    get:
      description: 支持 WebSocket、SSE、HTTP 轮询三种传输方式的实时告警推送演示，包含 CPU、内存、网络等多种指标
      parameters:
      - default: ws
        description: 传输方式 (ws/sse/poll)
        in: query
        name: transport
        type: string
      - default: 1000
        description: 每秒消息数
        in: query
        name: rate
        type: integer
      - default: 4
        description: 并发工作数 (仅 ws)
        in: query
        name: workers
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 告警推送 (WebSocket/SSE/Polling)
      tags:
      - 演示
  /auth/check:
    get:
      consumes:
      - application/json
      description: 验证 JWT Token 是否有效，返回剩余过期时间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: 验证 Token
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名密码登录，获取 JWT Token
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 Refresh Token 轮换获取新的 Access Token 和 Refresh Token，带重放攻击检测
      parameters:
      - description: 刷新请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 刷新 Token
      tags:
      - 认证
  /auth/used-tokens:
    get:
      description: 返回已被使用的 Refresh Token 数量（重放攻击检测统计）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 已用 Token 计数
      tags:
      - 认证
  /chat:
    post:
      consumes:
      - application/json
      description: 发送消息并获取 AI 回复，支持知识库上下文、Agent 调用、模型选择
      parameters:
      - description: 聊天请求
        in: body
        name: body
        required: true
        schema:
          properties:
            agentId:
              type: string
            agentType:
              type: string
            content:
              type: string
            conversationId:
              type: string
            knowledgeBaseId:
              type: string
            model:
              type: string
            useAgent:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 发送聊天消息
      tags:
      - 对话
  /chat/history/{conversationId}:
    delete:
      description: 清空指定会话的聊天历史消息
      parameters:
      - description: 会话 ID
        in: path
        name: conversationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 清空聊天历史
      tags:
      - 对话
    get:
      description: 获取指定会话的聊天历史消息
      parameters:
      - description: 会话 ID
        in: path
        name: conversationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取聊天历史
      tags:
      - 对话
  /chat/stream:
    post:
      consumes:
      - application/json
      description: 通过 Server-Sent Events 返回流式聊天回复
      parameters:
      - description: 聊天请求
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
            conversationId:
              type: string
            knowledgeBaseId:
              type: string
          type: object
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 聊天流式回复 (SSE)
      tags:
      - 对话
  /config:
    get:
      description: 返回模拟的集群配置（含名称、副本数、TLS、日志级别），用于演示 LRU 缓存
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 集群配置
      tags:
      - 演示
  /gis/points:
    get:
      description: 生成北京中心经纬度周围的模拟 GIS 点数据（含螺旋分布），用于前端地图可视化
      parameters:
      - default: 100000
        description: 点数 (1-500000)
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: GIS 地理坐标数据
      tags:
      - 演示
  /health:
    get:
      description: 返回 API 运行状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 健康检查
      tags:
      - 监控
  /knowledge-base:
    get:
      description: 返回所有知识库列表（含文档数、分块数）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出知识库
      tags:
      - 知识库
    post:
      consumes:
      - application/json
      description: 创建新的知识库，同时创建对应的向量集合
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 创建知识库
      tags:
      - 知识库
  /knowledge-base/{id}:
    delete:
      description: 删除指定知识库及其向量集合
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 删除知识库
      tags:
      - 知识库
    get:
      description: 获取指定知识库的详细信息，包含文档列表
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 获取知识库详情
      tags:
      - 知识库
  /knowledge-base/{id}/document:
    get:
      description: 获取指定知识库的文档列表
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取文档列表
      tags:
      - 知识库
    post:
      consumes:
      - application/json
      description: 向知识库中添加文档，自动进行分块和向量化存储
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: string
      - description: 文档内容
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
            mimeType:
              type: string
            source:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 添加文档
      tags:
      - 知识库
  /knowledge-base/{id}/document/{docId}:
    delete:
      description: 从知识库中删除指定文档
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: string
      - description: 文档 ID
        in: path
        name: docId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 删除文档
      tags:
      - 知识库
  /knowledge-base/{id}/documents/batch:
    post:
      consumes:
      - application/json
      description: 向知识库中批量添加多篇文档，每篇自动分块和向量化
      parameters:
      - description: 知识库 ID
        in: path
        name: id
        required: true
        type: string
      - description: 批量文档
        in: body
        name: body
        required: true
        schema:
          properties:
            documents:
              items:
                properties:
                  content:
                    type: string
                  title:
                    type: string
                type: object
              type: array
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 批量添加文档
      tags:
      - 知识库
  /knowledge-base/search:
    post:
      consumes:
      - application/json
      description: 在知识库中搜索相关文档（语义搜索）
      parameters:
      - description: 搜索请求
        in: body
        name: body
        required: true
        schema:
          properties:
            knowledgeBaseId:
              type: string
            query:
              type: string
            topK:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 搜索知识库
      tags:
      - 知识库
  /logs:
    get:
      description: 返回模拟的 200 条系统日志（含级别、时间、来源、消息），用于演示 LRU 缓存
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 日志列表
      tags:
      - 演示
  /models:
    get:
      description: 返回所有可用的 AI 模型列表（含 provider、上下文窗口、工具/视觉支持等）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出可用模型
      tags:
      - 模型
  /models/{id}:
    get:
      description: 获取指定 AI 模型的详细信息
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: 获取模型详情
      tags:
      - 模型
  /models/{id}/chat:
    post:
      consumes:
      - application/json
      description: 使用指定模型进行对话
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      - description: 对话请求
        in: body
        name: body
        required: true
        schema:
          properties:
            messages:
              items:
                $ref: '#/definitions/model.Message'
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 模型对话
      tags:
      - 模型
  /payments/create:
    post:
      consumes:
      - application/json
      description: 创建支付订单，支持幂等 Key 防止重复创建
      parameters:
      - description: 创建支付请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payment.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 创建支付订单
      tags:
      - 支付
  /payments/idempotency-test:
    post:
      consumes:
      - application/json
      description: 演示幂等 Key 机制：相同 Key 的重复请求返回缓存结果，不产生重复扣款
      parameters:
      - description: 幂等请求
        in: body
        name: body
        required: true
        schema:
          properties:
            amount:
              type: integer
            key:
              type: string
            orderNo:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 幂等性测试
      tags:
      - 支付
  /payments/order/{id}:
    get:
      description: 根据 ID 查询支付订单详情
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: string
      produces:

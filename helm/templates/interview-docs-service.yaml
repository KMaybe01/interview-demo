apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.interviewDocs.serviceName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.interviewDocs.name }}
    {{- include "interview-demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.interviewDocs.port }}
      targetPort: http
  selector:
    app: {{ .Values.interviewDocs.name }}

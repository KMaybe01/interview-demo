---
global:
  namespace: interview-demo

  labels:
    managed-by: helm
    part-of: interview-demo

ingress:
  enabled: true
  className: nginx
  host: interview-demo.example.com
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

backend:
  name: backend
  serviceName: backend-service
  image:
    repository: registry.gitlab.com/${CI_PROJECT_PATH}/backend
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  envFrom:
    - configMapRef:
        name: backend-config
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: /healthz
    port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  terminationGracePeriodSeconds: 30

frontend:
  name: frontend
  serviceName: frontend-service
  image:
    repository: registry.gitlab.com/${CI_PROJECT_PATH}/frontend
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 80
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  livenessProbe:
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: /
    port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  terminationGracePeriodSeconds: 30

configmap:
  name: backend-config
  data:
    GIN_MODE: "release"
    BACKEND_PORT: "8080"
